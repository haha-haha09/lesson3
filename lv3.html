<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lv3</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .wrap {
            display: flex;
            gap: 20px;
            /*盒子之间间距20px*/
            align-items: center;
            margin: 50px auto;
        }

        .box1 {
            width: 320px;
            height: 500px;
            background: #87CEFA;
            flex: 0 0 320px;
            /*不缩放，flex-shrink:0 不压缩，flex-grow:0 不放大 */
        }

        .box2 {
            width: 320px;
            height: 300px;
            background: #98FB98;
            flex: 1 1 320px;
            /*缩窄速度缓慢：flex-shrink:1*/
        }

        .box3 {
            width: 320px;
            height: 100px;
            background: #FFD799;
            align-self: flex-start;
            /*单独设置：顶部对齐*/
            flex: 1 1 320px;
        }

        .box4 {
            width: 320px;
            height: 600px;
            background: #ffaaaa;
            flex: 1 2 320px;
            /*缩窄速度更快：flex-shrink:2*/
        }

        .box1,
        .box2,
        .box3,
        .box4 {
            padding: 10px;
        }
    </style>
</head>

<body>
    <div class="wrap">
        <div class="box1">
            一号盒子
            <p>我始终保持原大小，不缩放。</p>
        </div>
        <div class="box2">
            二号盒子
            <p>浏览器界面变宽时，我占满其他元素剩下的所有空间</p>
        </div>
        <div class="box3">
            三号盒子
            <p>我和四号盒子的顶部对齐</p>
        </div>
        <div class="box4">
            四号盒子
            <p>浏览器界面变窄时，我缩窄的速度要比二、三号盒子快</p>
        </div>
    </div>
</body>

</html>
